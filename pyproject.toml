[project]
name = "synctech-bubbling-detection"
version = "0.1.0"
description = "Bubbling defect detection using DINOv2 and Anomalib on ROCm"
authors = [{ name = "Bogda", email = "bogdan.watula@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "albumentations",
    "scikit-learn",
    "anomalib",
    "onnx",
    "peft",
    "huggingface-hub",
    "transformers",
    "accelerate",
    "timm",
    "structlog",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data", "src/models", "src/utils"]

[tool.pyright]
include = ["src", "tests", "notebooks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
