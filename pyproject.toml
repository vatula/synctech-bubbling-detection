[project]
name = "synctech-bubbling-detection"
version = "0.1.0"
description = "Bubbling defect detection using DINOv2 and Anomalib on ROCm"
authors = [{ name = "Bogdan", email = "bogdan.watula@gmail.com" }]
requires-python = "==3.12.*"
dependencies = [
    "albumentations",
    "scikit-learn",
    "anomalib==2.3.3",
    "lightning>=2.6,<2.7",
    "torch>=2.11.0,<2.12",
    "onnx",
    "peft",
    "huggingface-hub",
    "transformers",
    "accelerate",
    "timm",
    "structlog",
    "onnxscript",
    "opencv-python-headless>=4.13.0.92",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
]
acceleration = [
    "xformers>=0.0.32.post2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data", "src/models", "src/utils"]

[tool.pyright]
include = ["src", "tests", "notebooks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
