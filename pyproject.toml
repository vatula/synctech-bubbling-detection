[project]
name = "synctech-bubbling-detection"
version = "0.1.0"
description = "Bubbling defect detection using DINOv2 and Anomalib on ROCm"
authors = [{ name = "Bogdan", email = "bogdan.watula@gmail.com" }]
requires-python = "==3.12.*"
dependencies = [
    "albumentations",
    "scikit-learn",
    "anomalib==2.3.3",
    "onnx",
    "peft",
    "huggingface-hub",
    "transformers",
    "accelerate",
    "timm",
    "structlog",
    "torch",
    "torchvision",
    "torchaudio",
    "onnxscript",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data", "src/models", "src/utils"]

[tool.pyright]
include = ["src", "tests", "notebooks"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
