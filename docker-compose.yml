x-service-common: &service-common
  build:
    context: .
    network: host
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ${CACHE_ROOT:-./.cache}/uv:/cache/uv
    - ${CACHE_ROOT:-./.cache}/pip:/cache/pip
    - ${CACHE_ROOT:-./.cache}/hf:/cache/hf
    - ${DATASET_PATH:-./resources/assignment}:/app/resources/assignment:ro
    - ${RESULTS_PATH:-./results}:/app/results:rw
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  privileged: true
  shm_size: "8gb"
  environment: &service-env
    HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-0}
    HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION:-11.0.0} # Navi 31 (7900 XTX/XT)
    DISTILLATION_EPOCHS: ${DISTILLATION_EPOCHS:-10}
    LOG_STREAM_MICRO_EXPERIMENT: ${LOG_STREAM_MICRO_EXPERIMENT:-0}
    LOG_STREAM_MICRO_DELAY_SECONDS: ${LOG_STREAM_MICRO_DELAY_SECONDS:-0.2}
    PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
    BUBBLING_IMAGE_SIZE: ${BUBBLING_IMAGE_SIZE:-280}
    DISTILLATION_STUDENT_ARCHITECTURE: ${DISTILLATION_STUDENT_ARCHITECTURE:-fastvit_t8}
    MIGRAPHX_PYTHON_PATH: ${MIGRAPHX_PYTHON_PATH:-/opt/rocm/lib}
    PYTHONPATH: ${MIGRAPHX_PYTHON_PATH:-/opt/rocm/lib}:${PYTHONPATH:-}
    UV_CACHE_DIR: /cache/uv
    UV_PROJECT_ENVIRONMENT: /cache/uv/project-env
    HF_HOME: /cache/hf
    TRANSFORMERS_CACHE: /cache/hf
    PIP_CACHE_DIR: /cache/pip

services:
  training:
    <<: *service-common
    container_name: bubbling-detection-training
    command: >
      bash -lc "set -euo pipefail;
      ./retrain.sh;
      ./evaluate.sh"

  pipeline:
    <<: *service-common
    container_name: bubbling-detection-pipeline
    command: >
      bash -lc "set -euo pipefail;
      ./run_pipeline.sh"

  cleanup:
    <<: *service-common
    container_name: bubbling-detection-cleanup
    command: >
      bash -lc "set -euo pipefail;
      ./cleanup.sh;"

  report-renderer:
    <<: *service-common
    container_name: bubbling-detection-report-renderer
    command: >
      bash -lc "set -euo pipefail;
      ./render_report.sh"

  training-dev:
    <<: *service-common
    profiles: ["dev"]
    container_name: bubbling-detection-training-dev
    command: >
      bash -lc "set -euo pipefail;
      ./retrain.sh;
      ./evaluate.sh"
    volumes:
      - .:/app
      - ${CACHE_ROOT:-./.cache}/uv:/cache/uv
      - ${CACHE_ROOT:-./.cache}/pip:/cache/pip
      - ${CACHE_ROOT:-./.cache}/hf:/cache/hf
      - ${DATASET_PATH:-./resources/assignment}:/app/resources/assignment:ro
      - ${RESULTS_PATH:-./results}:/app/results:rw

  pipeline-dev:
    <<: *service-common
    profiles: ["dev"]
    container_name: bubbling-detection-pipeline-dev
    command: >
      bash -lc "set -euo pipefail;
      ./run_pipeline.sh"
    volumes:
      - .:/app
      - ${CACHE_ROOT:-./.cache}/uv:/cache/uv
      - ${CACHE_ROOT:-./.cache}/pip:/cache/pip
      - ${CACHE_ROOT:-./.cache}/hf:/cache/hf
      - ${DATASET_PATH:-./resources/assignment}:/app/resources/assignment:ro
      - ${RESULTS_PATH:-./results}:/app/results:rw

  cleanup-dev:
    <<: *service-common
    profiles: ["dev"]
    container_name: bubbling-detection-cleanup-dev
    command: >
      bash -lc "set -euo pipefail;
      ./cleanup.sh;"
    volumes:
      - .:/app
      - ${CACHE_ROOT:-./.cache}/uv:/cache/uv
      - ${CACHE_ROOT:-./.cache}/pip:/cache/pip
      - ${CACHE_ROOT:-./.cache}/hf:/cache/hf
      - ${DATASET_PATH:-./resources/assignment}:/app/resources/assignment:ro
      - ${RESULTS_PATH:-./results}:/app/results:rw

  report-renderer-dev:
    <<: *service-common
    profiles: ["dev"]
    container_name: bubbling-detection-report-renderer-dev
    command: >
      bash -lc "set -euo pipefail;
      ./render_report.sh"
    volumes:
      - .:/app
      - ${CACHE_ROOT:-./.cache}/uv:/cache/uv
      - ${CACHE_ROOT:-./.cache}/pip:/cache/pip
      - ${CACHE_ROOT:-./.cache}/hf:/cache/hf
      - ${DATASET_PATH:-./resources/assignment}:/app/resources/assignment:ro
      - ${RESULTS_PATH:-./results}:/app/results:rw
